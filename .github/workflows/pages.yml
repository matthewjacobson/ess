name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a newer push cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p _site/dist _site/examples
          cp dist/streamlines.umd.min.js _site/dist/
          cp dist/streamlines.umd.min.js.map _site/dist/
          cp examples/canvas.html examples/cdn-demo.html _site/examples/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=./examples/canvas.html" />
          <title>ess demo</title>
          <a href="./examples/canvas.html">ess — evenly-spaced streamlines demo</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
